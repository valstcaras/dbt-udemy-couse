models:
  - name: dim_listings_cleansed
    description: This table contains the cleansed listings data from Airbnb.
    data_tests:
     - minimum_row_count:
        arguments:
         min_row_count: 10000000        
    columns:
        - name: listing_id
          description: The unique identifier for each listing.
          data_tests:
            - not_null
            - unique
        - name: host_id
          description: The unique identifier for each host.
          data_tests:
            - not_null
            - relationships:
                 arguments:
                   to: ref('dim_hosts_cleansed')
                   field: host_id  
        -  name: room_type
           description: The type of room being offered (e.g., Entire home/apt, Private room, Shared room, Hotel room).
           data_tests:
            - accepted_values:
                 arguments:
                   values: ['Entire home/apt',
                           'Private room',
                           'Shared room',
                           'Hotel room']
        - name: minimum_nights
          description: '{{ doc("dim_listing_cleansed__minimum_nights") }}'
          data_tests:
            - positive_values
  - name: dim_hosts_cleansed
    config:
     contract:
       enforced: true 
    constraints:
      - type: primary_key
        columns: [host_id]
    columns:
        - name: host_id
          data_type: integer
          constraints:
            - type: not_null
          data_tests:
            - not_null
            - unique
        - name: host_name
          constraints:
            - type: not_null
          data_type: string
          data_tests:
            - not_null
        - name: is_superhost
          data_type: string
          data_tests:
            - accepted_values:
                 arguments:
                   values: ['t', 'f']
        - name: updated_at
          data_type: timestamp
        - name: created_at
          data_type: timestamp

